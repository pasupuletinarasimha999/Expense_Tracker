workflows:
  ios-unsigned:
    name: iOS Unsigned Build (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (CocoaPods-only, avoids forced Dev Team signing)
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Prepare Flutter iOS build (frameworks + pod install, no compile)
        script: flutter build ios --release --no-codesign --config-only
      - name: Build unsigned iOS app via xcodebuild
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA for sideloading
        script: |
          mkdir -p Payload
          cp -r build/ios_manual/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -r $CM_BUILD_DIR/app-unsigned.ipa Payload
    artifacts:
      - app-unsigned.ipa
    publishing:
      email:
        recipients:
          - sumanthnandeti3@gmail.com
        notify:
          success: true
          failure: true
