workflows:
  ios-unsigned:
    name: iOS Unsigned Build (Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (CocoaPods-only, avoids forced Dev Team signing)
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for sideloading
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r $CM_BUILD_DIR/app-unsigned.ipa Payload
    artifacts:
      - app-unsigned.ipa
    publishing:
      email:
        recipients:
          - sumanthnandeti3@gmail.com
        notify:
          success: true
          failure: true
